[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "karnage"
version = "0.2.0"
description = "Target-independent LLVM bit-flip explorer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore= ["E501"]

[tool.ruff.format]
exclude = ["*"]
